<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>金剛經合注 · zhu-combined</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="top">
  <div class="brand">
    <h1>金剛經合注</h1>
    <p class="sub">姚秦 鳩摩羅什譯 · 別譯十一種 · 四十一家注疏 · 昭明三十二分</p>
  </div>
  <div class="search"><select id="sec-select" title="選分"></select><button id="searchBtn" class="theme" title="搜尋（經文／科文／注文）" aria-label="搜尋">🔍</button><button id="fsBtn" class="theme" title="全屏" aria-label="全屏">⛶</button><button id="bmBtn" class="theme" title="書籤" aria-label="書籤">♡</button><button id="theme" class="theme" title="明暗切換">☾</button><button id="simBtn" class="theme" title="繁體 / 無損簡體">简</button><button id="tourEntry" class="theme tour-icon" title="操作導覽（跟著做一次就會用）" aria-label="操作導覽">🦮</button></div>
</header>

<div id="searchPanel" hidden role="dialog" aria-modal="true" aria-label="搜尋">
  <div class="sp-veil" data-sp-close></div>
  <div class="sp-box">
    <div class="sp-bar">
      <span class="sp-ico" aria-hidden="true">🔍</span>
      <input id="spInput" type="search" placeholder="搜尋經文…" autocomplete="off" spellcheck="false" aria-label="搜尋關鍵字">
      <button id="spClose" class="sp-x" type="button" title="關閉（Esc）" aria-label="關閉">✕</button>
    </div>
    <div class="sp-scopes" role="tablist" aria-label="搜尋範圍">
      <button type="button" data-scope="sutra" class="on" role="tab" aria-selected="true">經文</button>
      <button type="button" data-scope="kepan" role="tab" aria-selected="false">科文</button>
      <button type="button" data-scope="notes" role="tab" aria-selected="false">注文</button>
      <span id="spCount" class="sp-count"></span>
    </div>
    <div id="spList" class="sp-list"></div>
    <div id="spPager" class="sp-pager" hidden></div>
  </div>
</div>

<div id="bmList" hidden role="dialog" aria-label="書籤清單">
  <div class="bm-h"><span>書籤</span><button type="button" class="bm-x" aria-label="關閉">✕</button></div>
  <div class="bm-body"></div>
</div>

<div id="layout">
  <main id="reader"></main>
  <div class="splitter" id="split-notes" title="拖曳調整注疏寬度；雙擊還原"></div>
<div id="sheet" class="closed" role="dialog" aria-modal="true" aria-label="句下注疏">
  <div class="backdrop" data-close></div>
  <section class="panel">
    <button id="close" class="sheet-close" title="關閉">✕</button>
    <div class="tabs2" id="tabs2"><button data-t="works" class="on">注疏</button><button data-t="alt">別譯</button><button data-t="phrase">詞組</button></div>
    <div id="cards" class="panel-body"></div>
  </section>
</div>

</div>

<footer id="foot">
  <p class="foot-free"><b>免費軟件</b>　杭州繪欣堂科技公司製作　聯絡人：魏秀秀（湛覺）　微信：wxx68174671，加微注明「金剛經合注」</p>
</footer>

<!-- 操作導覽（self-explaining-tour）：這些 id 由 player 使用，改樣式可以，別改名 -->
<div id="tourSpot" hidden></div>
<div id="tourBubble" role="dialog" aria-live="polite" hidden>
  <div class="tourHead">
    <span class="tourWhere" id="tourWhere"></span>
    <button type="button" class="tourClose" id="tourX" title="結束導覽（Esc）">✕</button>
  </div>
  <div id="tourTitle"></div>
  <div id="tourText"></div>
  <div id="tourNote" hidden></div>
  <div class="tourBtns">
    <button type="button" id="tourPrev" title="上一個場景（←）" hidden>← 上一場景</button>
    <button type="button" id="tourReplay" title="重播本場景" hidden>重播</button>
    <span class="tourProg" id="tourProg"></span>
    <button type="button" id="tourDone" hidden>我做好了</button>
    <button type="button" id="tourSkip" hidden>略過這步</button>
    <button type="button" id="tourNext" class="primary" hidden>下一個場景 →</button>
  </div>
</div>
<div id="tourBackdrop" hidden></div>
<div id="tourBox" role="dialog" aria-modal="true" aria-labelledby="tourMenuTitle" hidden>
  <div class="tourMenuHead">
    <h2 id="tourMenuTitle">操作導覽</h2>
    <button id="tourClose" class="tourClose" title="關閉（Esc）">✕</button>
  </div>
  <p class="tourHint">跟著做一次就會用。每個場景做完會停住，由你決定要不要往下。</p>
  <div id="tourList" class="tourList"></div>
</div>

<script src="lossless.js"></script>
<script src="zhu-data.js"></script>
<script src="app.js"></script>
<script src="tour.js"></script>
<div id="wtip" class="wtip" role="tooltip"></div>
</body>
</html>
